/**:
  ros__parameters:
    # Keep the physical robot envelope; resolve nearby obstacle cells more finely.
    map.resolution: 0.05
    # Gait oscillations can exceed the average command. Keep a physical planning
    # limit distinct from the conservative outgoing velocity limits below.
    planner.max_velocity: 0.5
    planner.max_acceleration: 0.5
    controller.max_vx: 0.15
    controller.max_vy: 0.10
    controller.max_yaw_rate: 0.25
    controller.heading_preview_distance: 0.4
    controller.preview_position_gain: 0.5
